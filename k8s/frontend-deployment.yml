apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: multivendor-app
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend-pod
      namespace: multivendor-app
      labels: 
        app: frontend
    spec: 
      containers:
      - name: multivendor-frontend
        image: krishankumargupta/multivendor-frontend1:latest
        ports: 
        - containerPort: 5173
        env: 
        - name: VITE_API_URL
          value: http://localhost:5000
